name: .NET E2E Tests

on:
  push:
    branches: [ "main"]
  pull_request:
    branches: [ "main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: github_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=github_test_db;Username=admin;Password=testpassword"
  
      ASPNETCORE_ENVIRONMENT: "Development"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    - name: Restore dependencies
      run: dotnet restore tests/Backend.Tests/Backend.Tests.csproj

    - name: Build
      run: dotnet build tests/Backend.Tests/Backend.Tests.csproj --no-restore

    - name: Run Tests
      run: dotnet test tests/Backend.Tests/Backend.Tests.csproj --no-build --verbosity normal
